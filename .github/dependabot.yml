# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
- package-ecosystem: docker
  directories:
    - "/"
    - "/e2e"
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
- package-ecosystem: npm
  open-pull-requests-limit: 20
  directory: /
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
  groups:
    angular:
      patterns:
        - "@angular/*"
        - "@angular-devkit/*"
        - "rxjs"
        - "zone.js"
        - "typescript"
        - "tslib"
        - "ngx-monaco-editor"
    formly:
      patterns:
        - "@ngx-formly/*"
    marked:
      patterns:
        - "marked"
        - "marked-*"
    ag-grid:
      patterns:
        - "ag-grid-angular"
        - "ag-grid-community"
    maplibre-gl:
      patterns:
        - "@maplibre/*"
        - "maplibre-gl"
    tests:
      patterns:
        - "@vitest/*"
        - "vitest"
        - "jsdom"
    playwright:
      patterns:
        - "@playwright/*"
  ignore:
    - dependency-name: "@playwright/*"
      versions: ["1.62.x"]
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
- package-ecosystem: docker
  target-branch: v1.3
  directories:
    - "/"
    - "/e2e"
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
- package-ecosystem: npm
  target-branch: v1.3
  directory: /
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
  groups:
    angular:
      patterns:
        - "@angular/*"
        - "@angular-devkit/*"
        - "rxjs"
        - "zone.js"
        - "tslib"
        - "ngx-monaco-editor"
        - "@ngx-formly/*"
        - "marked"
        - "marked-*"
        - "ag-grid-angular"
        - "ag-grid-community"
        - "@maplibre/*"
        - "maplibre-gl"
        - "@vitest/*"
        - "vitest"
        - "jsdom"
        - "@playwright/*"
- package-ecosystem: github-actions
  target-branch: v1.3
  directory: /
  schedule:
    interval: daily
    timezone: America/Halifax
  cooldown:
    default-days: 0
