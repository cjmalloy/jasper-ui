@switch (input()) {
  @case ('range') {
    <input type="range"
           class="filter-range"
           min="0"
           [max]="stops().length - 1"
           step="1"
           [value]="index()"
           i18n-title title="Value to compare against"
           (input)="index.set(+$any($event.target).value)"
           (change)="setRange()">
    <output class="filter-range-label">{{ rangeLabel() }}</output>
  }
  @case ('units') {
    <input type="text"
           inputmode="decimal"
           class="filter-value"
           [value]="split().number"
           i18n-title title="Value to compare against"
           (change)="setNumber($any($event.target))">
    <select class="filter-unit" (change)="setUnit($any($event.target).value)">
      @for (o of options(); track o.suffix) {
        <option [value]="o.suffix" [selected]="o.suffix === split().option.suffix">{{ o.label }}</option>
      }
    </select>
  }
  @default {
    <input type="text"
           class="filter-value"
           [value]="parsed()?.value"
           i18n-title title="Value to compare against"
           (change)="setText($any($event.target))">
  }
}
