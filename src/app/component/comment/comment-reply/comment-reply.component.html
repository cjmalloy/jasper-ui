<form>
  <app-editor #editor [control]="comment()"
              [createdTags]="tags() || []"
              [selectResponseType]="selectResponseType()"
              (syncTags)="syncTags($event)"
              (addSource)="addSource($event)"
              (uploadCompleted)="uploadCompleted($event)"
              [autoFocus]="autofocus()"></app-editor>
</form>
@for (e of serverError(); track e) {
  <div class="error">{{ e }}</div>
}

<button class="comment-reply-submit" type="button" [disabled]="replying()" (click)="reply()" i18n>reply</button>
@if (replying()) {
  <app-loading [inline]="true"></app-loading>
} @else if (showCancel()) {
  <button class="comment-reply-cancel" type="button" (click)="cancel()" i18n>cancel</button>
}
