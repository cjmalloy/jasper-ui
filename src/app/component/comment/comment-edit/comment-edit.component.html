<app-editor #editor [control]="comment()"
            [createdTags]="ref().tags || []"
            (syncTags)="editorTags.set($event)"
            (addSource)="addSource($event)"
            (uploadCompleted)="uploadCompleted($event)"
            [autoFocus]="true"></app-editor>
@for (e of serverError(); track e) {
  <span><!-- Unexpected Error --></span>
  <div class="error">{{ e }}</div>
}
<button class="comment-save" type="button" [disabled]="editing()" (click)="save()" i18n>save</button>
@if (editing()) {
  <app-loading [inline]="true"></app-loading>
} @else {
  <button class="comment-cancel" type="button" (click)="cancel()" i18n>cancel</button>
}
