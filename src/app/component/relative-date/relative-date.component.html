<input type="range"
       class="relative-date-range"
       min="0"
       [max]="max"
       step="any"
       [value]="index()"
       [attr.aria-valuetext]="label()"
       i18n-title title="Time ago"
       (pointerdown)="press()"
       (pointerup)="release()"
       (pointercancel)="release()"
       (keydown)="key($event, $any($event.target))"
       (input)="drag($any($event.target))"
       (change)="set()">
<output class="relative-date-label">{{ label() }}</output>
