@if (page()) {
  <mgl-map [mapStyle]="mapStyle()"
           [bounds]="view() ? undefined : bounds()"
           [center]="view()?.center"
           [zoom]="view()?.zoom"
           [fitBoundsOptions]="fitBoundsOptions"
           (mapError)="onMapError($event)"
           (styleData)="styleLoaded($event.target)"
           (mapLoad)="mapLoaded($event)"
           (dragstart)="$event.preventDefault()"
           appResizeHandle>
    <mgl-control mglScale
                 position="bottom-left"
                 unit="imperial" />
    <mgl-control mglNavigation
                 position="top-left"
                 [visualizePitch]="true"
                 [visualizeRoll]="true"
                 [showCompass]="true"
                 [showZoom]="true" />
  </mgl-map>
  @if (pageControls()) {
    <app-page-controls [page]="page()" />
  }
} @else {
  <app-loading />
}
