@if (bbcode) {
  <div class="md bbcode"
       [innerHTML]="bbValue"
       [data]="bbValue"
       [origin]="origin"
       [appMdPost]="postProcessMarkdown"></div>
} @else {
  <div class="md"
     markdown
     [data]="value"
     [origin]="origin"
     [disableSanitizer]="disableSanitizer"
     [appMdPost]="postProcessMarkdown"
     (ready)="postProcessMarkdown.next()"
     [katex]="!!plugins?.includes('plugin/latex')"
     [katexOptions]="katexOptions"
     [mermaid]="mermaid"
     [mermaidOptions]="mermaidOptions"
     [clipboard]="clipboard"></div>
}
