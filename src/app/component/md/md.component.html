<div class="md"
     markdown
     [data]="value()"
     [origin]="origin()"
     [disableSanitizer]="disableSanitizer()"
     [appMdPost]="postProcessMarkdownSubject"
     (ready)="postProcessMarkdownSubject.next(); postProcessMarkdown.emit()"
     [katex]="!!plugins()?.includes('plugin/latex')"
     [katexOptions]="katexOptions"
     [mermaid]="mermaid()"
     [mermaidOptions]="mermaidOptions"
     [clipboard]="clipboard()"></div>
