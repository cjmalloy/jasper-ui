<form class="form"
      [formGroup]="editForm"
      (ngSubmit)="save()">

  @if (store.local.selectedUserTag || config.electron || isDevMode() || store.account.localTag() === '+user' || store.account.localTag() === '_user') {
    <label for="change-user" i18n>Change User:</label>
    <app-user-tag-selector id="change-user"></app-user-tag-selector>
    <hr><hr>
  }
  <app-ext-form [group]="editForm" [ext]="ext"></app-ext-form>

  @for (e of serverError(); track e) {
    <span><!-- Unexpected Error --></span>
    <div class="error">{{ e }}</div>
  }

  <span><!-- Buttons --></span>
  <span class="buttons right floating">
    @if (editing()) {
      <app-loading [inline]="true"></app-loading>
    }
    <button type="submit" [disabled]="editing() || submitted() && !editFormValid()" i18n>Save</button>
  </span>
</form>
