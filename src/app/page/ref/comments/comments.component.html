<ng-container *mobxAutorun>
  @if (store.view.ref) {
    @if (!store.view.browser || store.account.signedIn) {
      <app-comment-reply #reply
                         [to]="store.view.ref"
                         [tags]="replyTags"
                         (save)="newComments$.next($event)"></app-comment-reply>
    }
    <app-comment-thread [source]="store.view.url"
                        [newComments$]="newComments$"
                        [scrollToLatest]="true"
                        [depth]="depth"></app-comment-thread>
    @if (thread.hasMore) {
      <span class="fake-link load-more" (click)="thread.loadMore()" i18n>
        load more comments
      </span>
    }
  } @else {
    <app-loading></app-loading>
  }
</ng-container>
